<section>
    <h2>视觉模拟 - 实时色盲视觉预览</h2>

    <div style="margin-bottom:16px;">
        <label>上传图片： <input type="file" id="fileInput" accept="image/*"></label>
        <label style="margin-left:16px;">或选择示例：
            <select id="exampleSelect">
                <option value="">-- 示例图 --</option>
                <option value="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==">红色示例</option>
                <option value="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8HgDwAEhQGAhKmMIQAAAABJRU5ErkJggg==">蓝色示例</option>
            </select>
        </label>
    </div>

    <div style="margin-bottom:16px;">
        <label>色盲类型：
            <select id="typeSelect">
                <option value="protanopia">红色盲 (Protanopia)</option>
                <option value="deuteranopia">绿色盲 (Deuteranopia)</option>
                <option value="tritanopia">蓝色盲 (Tritanopia)</option>
                <option value="achromatopsia">全色盲 (Achromatopsia)</option>
            </select>
        </label>
        <label style="margin-left:16px;">严重度：
            <input type="range" id="severitySlider" min="0" max="1" step="0.01" value="1">
            <span id="severityValue">100%</span>
        </label>
    </div>

    <div style="display:flex; gap:16px; flex-wrap:wrap;">
        <div>
            <h3>原始图像</h3>
            <canvas id="originalCanvas" style="border:1px solid #ccc; max-width:100%;"></canvas>
        </div>
        <div>
            <h3>模拟图像</h3>
            <canvas id="simulatedCanvas" style="border:1px solid #ccc; max-width:100%;"></canvas>
        </div>
    </div>
</section>

<script>
    (function() {
        const fileInput = document.getElementById('fileInput');
        const exampleSelect = document.getElementById('exampleSelect');
        const typeSelect = document.getElementById('typeSelect');
        const severitySlider = document.getElementById('severitySlider');
        const severityValue = document.getElementById('severityValue');
        const originalCanvas = document.getElementById('originalCanvas');
        const simulatedCanvas = document.getElementById('simulatedCanvas');
        const ctxOrig = originalCanvas.getContext('2d');
        const ctxSim = simulatedCanvas.getContext('2d');

        let img = new Image();
        let imgLoaded = false;

        function loadImageFromURL(url) {
            img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = function() {
                imgLoaded = true;
                resizeCanvases();
                drawOriginal();
                applySimulation();
            };
            img.onerror = function() {
                alert('无法加载图片');
            };
            img.src = url;
        }

        function loadImageFromFile(file) {
            const url = URL.createObjectURL(file);
            loadImageFromURL(url);
        }

        function resizeCanvases() {
            const scale = Math.min(1, 500 / img.width);
            originalCanvas.width = img.width * scale;
            originalCanvas.height = img.height * scale;
            simulatedCanvas.width = originalCanvas.width;
            simulatedCanvas.height = originalCanvas.height;
        }

        function drawOriginal() {
            ctxOrig.clearRect(0,0,originalCanvas.width,originalCanvas.height);
            ctxOrig.drawImage(img,0,0,originalCanvas.width,originalCanvas.height);
        }

        function applySimulation() {
            if (!imgLoaded) return;
            ctxSim.clearRect(0,0,simulatedCanvas.width,simulatedCanvas.height);
            ctxSim.drawImage(img,0,0,simulatedCanvas.width,simulatedCanvas.height);
            const imageData = ctxSim.getImageData(0,0,simulatedCanvas.width,simulatedCanvas.height);
            const data = imageData.data;
            const severity = parseFloat(severitySlider.value);
            const type = typeSelect.value;

            // 色盲转换矩阵 (来源: Vienot, Brettel & Mollon 1999)
            let m = [
                [1,0,0],
                [0,1,0],
                [0,0,1]
            ];
            if (type === 'protanopia') {
                m = [
                    [0.567,0.433,0],
                    [0.558,0.442,0],
                    [0,0.242,0.758]
                ];
            } else if (type === 'deuteranopia') {
                m = [
                    [0.625,0.375,0],
                    [0.7,0.3,0],
                    [0,0.3,0.7]
                ];
            } else if (type === 'tritanopia') {
                m = [
                    [0.95,0.05,0],
                    [0,0.433,0.567],
                    [0,0.475,0.525]
                ];
            } else if (type === 'achromatopsia') {
                m = [
                    [0.299,0.587,0.114],
                    [0.299,0.587,0.114],
                    [0.299,0.587,0.114]
                ];
            }
            // 线性插值到正常视觉
            const I = [
                [1,0,0],
                [0,1,0],
                [0,0,1]
            ];
            for (let i=0;i<3;i++) {
                for (let j=0;j<3;j++) {
                    m[i][j] = I[i][j] + severity * (m[i][j] - I[i][j]);
                }
            }

            for (let i=0;i<data.length;i+=4) {
                const r = data[i]   / 255;
                const g = data[i+1] / 255;
                const b = data[i+2] / 255;
                const sr = m[0][0]*r + m[0][1]*g + m[0][2]*b;
                const sg = m[1][0]*r + m[1][1]*g + m[1][2]*b;
                const sb = m[2][0]*r + m[2][1]*g + m[2][2]*b;
                data[i]   = Math.round(sr * 255);
                data[i+1] = Math.round(sg * 255);
                data[i+2] = Math.round(sb * 255);
            }
            ctxSim.putImageData(imageData,0,0);
        }

        fileInput.addEventListener('change', function(e){
            if (e.target.files[0]) {
                loadImageFromFile(e.target.files[0]);
            }
        });

        exampleSelect.addEventListener('change', function(e){
            if (e.target.value) {
                loadImageFromURL(e.target.value);
            }
        });

        typeSelect.addEventListener('change', applySimulation);
        severitySlider.addEventListener('input', function(){
            severityValue.textContent = Math.round(severitySlider.value*100) + '%';
            applySimulation();
        });
    })();
</script>
