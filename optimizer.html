<section class="section">
  <h2 class="section-title">无障碍优化 - 图像色觉适配工具</h2>
  <div class="section-body">
    <div class="card">
      <div class="card-content">
        <label for="uploadInput" class="btn">选择图片</label>
        <input type="file" id="uploadInput" accept="image/*" style="display:none;">
        <div id="preview" style="margin-top:16px; display:flex; gap:16px; flex-wrap:wrap;">
          <div>
            <canvas id="origCanvas" width="256" height="256" style="border:1px solid #ccc;"></canvas>
            <div style="text-align:center; margin-top:4px;">原图</div>
          </div>
          <div>
            <canvas id="optCanvas" width="256" height="256" style="border:1px solid #ccc;"></canvas>
            <div style="text-align:center; margin-top:4px;">优化后</div>
          </div>
        </div>
        <div style="margin-top:16px;">
          <label class="btn" id="analyzeBtn" style="margin-right:8px;">分析并优化</label>
          <a id="downloadLink" class="btn" style="display:none;">下载优化图片</a>
        </div>
        <div style="margin-top:16px;">
          <h3 style="margin-bottom:8px;">优化选项</h3>
          <ul class="list">
            <li class="list-item"><label><input type="checkbox" id="optContrast" checked> 高对比度增强</label></li>
            <li class="list-item"><label><input type="checkbox" id="optPalette"> 色盲友好配色替换</label></li>
            <li class="list-item"><label><input type="checkbox" id="optPattern"> 图案纹理叠加</label></li>
            <li class="list-item"><label><input type="checkbox" id="optAnnotation"> 文字标注增强</label></li>
          </ul>
        </div>

<script>
document.getElementById('uploadInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = function(){
    const origCanvas = document.getElementById('origCanvas');
    const ctx = origCanvas.getContext('2d');
    const maxSize = 256;
    let width = img.width, height = img.height;
    if (width > height) {
      if (width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
    } else {
      if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
    }
    origCanvas.width = width; origCanvas.height = height;
    ctx.drawImage(img,0,0,width,height);
    const optCanvas = document.getElementById('optCanvas');
    const optCtx = optCanvas.getContext('2d');
    optCanvas.width = width; optCanvas.height = height;
    optCtx.drawImage(img,0,0,width,height);
  };
  img.src = URL.createObjectURL(file);
});

function getImageData(canvas){
  const ctx = canvas.getContext('2d');
  return ctx.getImageData(0,0,canvas.width,canvas.height);
}
function putImageData(canvas, imagedata){
  const ctx = canvas.getContext('2d');
  ctx.putImageData(imagedata,0,0);
}
function rgbToLuminance(r,g,b){
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function process(){
  const origCanvas = document.getElementById('origCanvas');
  if (origCanvas.width===0) return alert('请先上传图片');
  const optCanvas = document.getElementById('optCanvas');
  const optCtx = optCanvas.getContext('2d');
  optCtx.drawImage(origCanvas,0,0);
  let imagedata = optCtx.getImageData(0,0,optCanvas.width,optCanvas.height);
  const data = imagedata.data;
  const w = optCanvas.width, h = optCanvas.height;
  const lowMask = new Uint8ClampedArray(w*h);
  const threshold = 30;
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const idx = (y*w + x)*4;
      const lum = rgbToLuminance(data[idx], data[idx+1], data[idx+2]);
      let sum=0, count=0;
      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          if(dx===0 && dy===0) continue;
          const nidx = ((y+dy)*w + (x+dx))*4;
          const nlum = rgbToLuminance(data[nidx], data[nidx+1], data[nidx+2]);
          sum += Math.abs(lum - nlum);
          count++;
        }
      }
      const avg = sum/count;
      if(avg < threshold) lowMask[y*w + x] = 255;
    }
  }
  const doContrast = document.getElementById('optContrast').checked;
  const doPalette = document.getElementById('optPalette').checked;
  const doPattern = document.getElementById('optPattern').checked;
  const doAnnotation = document.getElementById('optAnnotation').checked;
  if(doContrast){
    const hist = new Array(256).fill(0);
    for(let i=0;i<data.length;i+=4){
      const lum = rgbToLuminance(data[i], data[i+1], data[i+2]);
      hist[Math.round(lum)]++;
    }
    const sum = w*h;
    const cdf = new Array(256);
    let cum=0;
    for(let i=0;i<256;i++){
      cum += hist[i];
      cdf[i] = Math.round((cum/sum)*255);
    }
    for(let i=0;i<data.length;i+=4){
      const lum = rgbToLuminance(data[i], data[i+1], data[i+2]);
      const newLum = cdf[Math.round(lum)];
      const factor = lum===0 ? 0 : newLum/lum;
      data[i] = Math.round(data[i]*factor);
      data[i+1] = Math.round(data[i+1]*factor);
      data[i+2] = Math.round(data[i+2]*factor);
    }
  }
  if(doPalette){
    for(let i=0;i<data.length;i+=4){
      let r=data[i], g=data[i+1], b=data[i+2];
      const rSim = 0.567*r + 0.433*g;
      const gSim = 0.558*g + 0.442*r;
      const bSim = b;
      const errR = r - rSim;
      const errG = g - gSim;
      const errB = b - bSim;
      data[i] = Math.min(255, r + 0.8*errR);
      data[i+1] = Math.min(255, g + 0.8*errG);
      data[i+2] = Math.min(255, b + 0.8*errB);
    }
  }
  if(doAnnotation){
    optCtx.strokeStyle = 'rgba(255,0,0,0.8)';
    optCtx.lineWidth = 2;
    for(let y=1;y<h-1;y++){
      for(let x=1;x<w-1;x++){
        if(lowMask[y*w + x]){
          optCtx.strokeRect(x-1, y-1, 3, 3);
        }
      }
    }
  }
  if(doPattern){
    const patternCanvas = document.createElement('canvas');
    patternCanvas.width = w; patternCanvas.height = h;
    const pctx = patternCanvas.getContext('2d');
    pctx.clearRect(0,0,w,h);
    pctx.strokeStyle = 'rgba(255,255,255,0.2)';
    pctx.lineWidth = 1;
    for(let i=-h;i<w;i+=20){
      pctx.beginPath();
      pctx.moveTo(i>0?0:-i, i>0?i:0);
      pctx.lineTo(i+w<h?i+w:w, i+w<h?h:h-(i+w-w));
      pctx.stroke();
    }
    optCtx.globalAlpha = 0.8;
    optCtx.drawImage(patternCanvas,0,0);
    optCtx.globalAlpha = 1.0;
  }
  putImageData(optCanvas, imagedata);
  document.getElementById('downloadLink').style.display = 'inline-block';
  document.getElementById('downloadLink').href = optCanvas.toDataURL('image/png');
  document.getElementById('downloadLink').download = 'optimized.png';
}
document.getElementById('analyzeBtn').addEventListener('click', process);
</script>
