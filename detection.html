<sectionclass="section">
  <h2 class="section-title">色觉检测</h2>
  <div class="section-body">
    <div id="tests">
      <!-- 石原氏色盲检测图 -->
      <article class="card">
        <div class="card-content">
          <h3>石原氏色盲检测图</h3>
          <div id="ishihara-container"></div>
          <p>你看到的数字是：<input type="text" id="ishihara-answer" maxlength="2"></p>
          <button class="btn" id="ishihara-check">检查答案</button>
          <p id="ishihara-feedback"></p>
        </div>
      </article>

      <!-- 色相排列测试 -->
      <article class="card">
        <div class="card-content">
          <h3>色相排列测试</h3>
          <div id="hue-sortable" class="grid"></div>
          <button class="btn" id="hue-check">提交排序</button>
          <p id="hue-feedback"></p>
        </div>
      </article>

      <!-- 颜色匹配测试 -->
      <article class="card">
        <div class="card-content">
          <h3>颜色匹配测试</h3>
          <div id="match-target" class="media"><div id="target-color" style="width:100px;height:100px;border:2px solid #555;"></div></div>
          <div id="match-palette" class="grid"></div>
          <p>点击最接近目标颜色的色块</p>
          <button class="btn" id="match-check">检查匹配</button>
          <p id="match-feedback"></p>
        </div>
      </article>

      <button class="btn" id="finish-test">完成检测并查看结果</button>
      <div id="result" class="card" style="display:none;">
        <div class="card-content">
          <h3>检测结果</h3>
          <p id="result-text"></p>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  // ---------- Ishihara Test ----------
  const ishiharaContainer = document.getElementById('ishihara-container');
  const ishiharaAnswer = document.getElementById('ishihara-answer');
  const ishiharaCheck = document.getElementById('ishihara-check');
  const ishiharaFeedback = document.getElementById('ishihara-feedback');
  let ishiharaCorrect = false;

  // Simple Ishihara-like plate: number 74 on a noisy background
  function drawIshihara() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '250');
    svg.setAttribute('height', '250');
    svg.setAttribute('style', 'border:1px solid #ccc;background:#fafafa;');
    // Background dots
    for (let i = 0; i < 500; i++) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      const r = 4 + Math.random() * 3;
      const cx = Math.random() * 250;
      const cy = Math.random() * 250;
      // random background color (mostly red/green confusion colors)
      const rnd = Math.random();
      let color;
      if (rnd < 0.33) color = 'rgb(220,50,50)'; // red-ish
      else if (rnd < 0.66) color = 'rgb(50,180,50)'; // green-ish
      else color = 'rgb(180,180,180)'; // gray
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', cy);
      circle.setAttribute('r', r);
      circle.setAttribute('fill', color);
      svg.appendChild(circle);
    }
    // Number 74 in a color visible to normal vision (dark blue)
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', '50%');
    text.setAttribute('y', '55%');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('font-size', '48');
    text.setAttribute('fill', '#003366');
    text.setAttribute('font-family', 'sans-serif');
    text.setAttribute('font-weight', 'bold');
    text.textContent = '74';
    svg.appendChild(text);
    ishiharaContainer.innerHTML = '';
    ishiharaContainer.appendChild(svg);
  }
  drawIshihara();

  ishiharaCheck.addEventListener('click', () => {
    const ans = ishiharaAnswer.value.trim();
    if (ans === '74') {
      ishiharaFeedback.textContent = '正确！';
      ishiharaFeedback.style.color = 'green';
      ishiharaCorrect = true;
    } else {
      ishiharaFeedback.textContent = '错误，请再看一次。';
      ishiharaFeedback.style.color = 'red';
      ishiharaCorrect = false;
    }
  });

  // ---------- Hue Arrangement Test ----------
  const hueSortable = document.getElementById('hue-sortable');
  const hueCheck = document.getElementById('hue-check');
  const hueFeedback = document.getElementById('hue-feedback');
  let hueCorrect = false;
  const hueItems = [];

  function createHueItems() {
    hueSortable.innerHTML = '';
    hueItems.length = 0;
    const count = 10;
    for (let i = 0; i < count; i++) {
      const hue = Math.floor((i / count) * 360);
      const color = `hsl(${hue}, 80%, 50%)`;
      const div = document.createElement('div');
      div.className = 'grid-item';
      div.style.backgroundColor = color;
      div.dataset.hue = hue;
      div.draggable = true;
      div.style.cursor = 'move';
      div.style.border = '2px solid #ccc';
      div.style.borderRadius = '4px';
      div.style.width = '60px';
      div.style.height = '60px';
      div.style.display = 'flex';
      div.style.alignItems = 'center';
      div.style.justifyContent = 'center';
      div.style.color = '#fff';
      div.style.fontSize = '0.8rem';
      div.textContent = `${hue}°`;
      hueSortable.appendChild(div);
      hueItems.push(div);
    }
    addDragListeners();
  }
  function addDragListeners() {
    const items = hueSortable.querySelectorAll('.grid-item');
    items.forEach(item => {
      item.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', item.dataset.hue);
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
      });
      item.addEventListener('dragover', e => e.preventDefault());
      item.addEventListener('drop', e => {
        e.preventDefault();
        const draggedHue = e.dataTransfer.getData('text/plain');
        const draggedItem = [...items].find(it => it.dataset.hue === draggedHue);
        const targetItem = item;
        if (draggedItem && targetItem && draggedItem !== targetItem) {
          const draggedIndex = [...items].indexOf(draggedItem);
          const targetIndex = [...items].indexOf(targetItem);
          hueSortable.insertBefore(draggedItem, targetIndex > draggedIndex ? targetItem.nextSibling : targetItem);
        }
      });
    });
  }
  createHueItems();

  hueCheck.addEventListener('click', () => {
    const items = hueSortable.querySelectorAll('.grid-item');
    let ordered = true;
    let prevHue = -1;
    items.forEach(item => {
      const hue = parseInt(item.dataset.hue, 10);
      if (hue < prevHue) ordered = false;
      prevHue = hue;
    });
    if (ordered) {
      hueFeedback.textContent = '排序正确！';
      hueFeedback.style.color = 'green';
      hueCorrect = true;
    } else {
      hueFeedback.textContent = '排序有误，请按色相从小到大排列。';
      hueFeedback.style.color = 'red';
      hueCorrect = false;
    }
  });

  // ---------- Color Matching Test ----------
  const matchTarget = document.getElementById('match-target');
  const targetColorDiv = document.getElementById('target-color');
  const matchPalette = document.getElementById('match-palette');
  const matchCheck = document.getElementById('match-check');
  const matchFeedback = document.getElementById('match-feedback');
  let matchCorrect = false;
  let targetRGB = {r:0,g:0,b:0};
  let paletteRGBs = [];

  function randomColor() {
    return {
      r: Math.floor(Math.random()*200)+20,
      g: Math.floor(Math.random()*200)+20,
      b: Math.floor(Math.random()*200)+20
    };
  }
  function rgbToString({r,g,b}) {
    return `rgb(${r},${g},${b})`;
  }
  function colorDistance(c1,c2) {
    return Math.sqrt(
      Math.pow(c1.r-c2.r,2)+
      Math.pow(c1.g-c2.g,2)+
      Math.pow(c1.b-c2.b,2)
    );
  }
  function loadMatchTest() {
    targetRGB = randomColor();
    targetColorDiv.style.backgroundColor = rgbToString(targetRGB);
    // generate palette: one close color, others far
    paletteRGBs = [];
    // close color (within 30 distance)
    const close = {
      r: Math.max(0, Math.min(255, targetRGB.r + Math.floor(Math.random()*60)-30)),
      g: Math.max(0, Math.min(255, targetRGB.g + Math.floor(Math.random()*60)-30)),
      b: Math.max(0, Math.min(255, targetRGB.b + Math.floor(Math.random()*60)-30))
    };
    paletteRGBs.push(close);
    // 7 random distinct colors
    while (paletteRGBs.length < 8) {
      const col = randomColor();
      // ensure not too close to target ( > 80 ) to make answer obvious
      if (colorDistance(col, targetRGB) > 80) {
        let dup = false;
        for (const existing of paletteRGBs) {
          if (Math.abs(existing.r-col.r)<5 && Math.abs(existing.g-col.g)<5 && Math.abs(existing.b-col.b)<5) {
            dup = true; break;
          }
        }
        if (!dup) paletteRGBs.push(col);
      }
    }
    // shuffle
    for (let i = paletteRGBs.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [paletteRGBs[i], paletteRGBs[j]] = [paletteRGBs[j], paletteRGBs[i]];
    }
    // render palette
    matchPalette.innerHTML = '';
    paletteRGBs.forEach((col, idx) => {
      const div = document.createElement('div');
      div.className = 'grid-item';
      div.style.backgroundColor = rgbToString(col);
      div.dataset.index = idx;
      div.style.cursor = 'pointer';
      div.style.border = '2px solid #999';
      div.style.borderRadius = '4px';
      div.style.width = '50px';
      div.style.height = '50px';
      matchPalette.appendChild(div);
    });
    // attach click listeners
    matchPalette.querySelectorAll('.grid-item').forEach(item => {
      item.addEventListener('click', () => {
        matchPalette.querySelectorAll('.grid-item').forEach(i=>i.style.border='2px solid #999');
        item.style.border = '2px solid #fff';
        item.style.boxShadow = '0 0 6px 2px #fff';
        matchSelectedIdx = parseInt(item.dataset.index,10);
      });
    });
  }
  let matchSelectedIdx = null;
  loadMatchTest();

  matchCheck.addEventListener('click', () => {
    if (matchSelectedIdx === null) {
      matchFeedback.textContent = '请先选择一个颜色。';
      matchFeedback.style.color = 'orange';
      return;
    }
    const selected = paletteRGBs[matchSelectedIdx];
    const dist = colorDistance(selected, targetRGB);
    // find closest in palette
    let minDist = 1000;
    let closestIdx = -1;
    paletteRGBs.forEach((col, idx) => {
      const d = colorDistance(col, targetRGB);
      if (d < minDist) { minDist = d; closestIdx = idx; }
    });
    if (matchSelectedIdx === closestIdx) {
      matchFeedback.textContent = '匹配正确！';
      matchFeedback.style.color = 'green';
      matchCorrect = true;
    } else {
      matchFeedback.textContent = `匹配错误。最接近的是索引 ${closestIdx}。`;
      matchFeedback.style.color = 'red';
      matchCorrect = false;
    }
  });

  // ---------- Finish and Show Result ----------
  const finishBtn = document.getElementById('finish-test');
  const resultDiv = document.getElementById('result');
  const resultText = document.getElementById('result-text');

  finishBtn.addEventListener('click', () => {
    const score = [ishiharaCorrect, hueCorrect, matchCorrect].filter(Boolean).length;
    let message, advice;
    if (score === 3) {
      message = '您的色觉表现正常。';
      advice = '继续保持良好的用眼习惯。';
    } else if (score === 2) {
      message = '您的色觉表现略有偏弱。';
      advice = '建议在需要精确色辨别的环境中使用辅助工具或咨询专业眼科医生。';
    } else {
      message = '您的色觉表现可能存在异常。';
      advice = '请尽快进行专业色觉检查，以获得准确评估。';
    }
    resultText.innerHTML = `<strong>得分：${score}/3</strong><p>${message}</p><p>建议：${advice}</p>`;
    resultDiv.style.display = 'block';
  });
</script>
